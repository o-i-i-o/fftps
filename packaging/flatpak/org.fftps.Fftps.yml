# fftps flatpak manifest —— 分发补充渠道（deb 为主要 Linux 形态）
#
# 与 deb 的运行模型差异：沙箱内没有 systemd --user（launch 里 systemctl
# 静默失败），fftpd 由 fftp-http-launch 包装在沙箱内拉起；配置落在沙箱
# XDG 目录（~/.var/app/org.fftps.Fftps/），宿主浏览器经 portal 打开。
#
# 本地构建（需先安装 runtime/SDK，见 scripts/build-flatpak.sh）：
#   ./scripts/build-flatpak.sh            # 产出 dist/flatpak-repo 与 .flatpak bundle
#   ./scripts/build-flatpak.sh -i         # 构建并装入当前用户安装
#
# runtime 统一基于 org.freedesktop.Platform 26.08（项目约定）。
#
# cargo 依赖经 cargo-sources.json 完整 vendor（离线、可复现）。依赖变更后
# 重新生成（依赖 aiohttp/tomlkit，apt 包 python3-aiohttp python3-tomlkit）：
#   flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
id: org.fftps.Fftps
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  # 不带 //分支 后缀：扩展元数据声明 runtime=org.freedesktop.Sdk/x86_64/<runtime-version>，
  # 会随 runtime 自动匹配（带后缀在本地 flatpak-builder 1.4.x 解析报 "not installed"）
  - org.freedesktop.Sdk.Extension.rust-stable
command: fftp-http-launch
finish-args:
  # fftpd/fftp-http 监听端口；flatpak 无独立网络命名空间，宿主 loopback 直达
  - --share=network
  # FTP/SFTP 根目录可能覆盖用户全盘文件（flathub 上架审核关注点）
  - --filesystem=home
  # xdg-open 打开宿主浏览器、错误通知均走 portal
  - --talk-name=org.freedesktop.portal.Desktop
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - "*.a"
modules:
  - name: fftps
    buildsystem: meson
    builddir: true
    config-opts:
      - "-Dprofile=release"
      - "-Dflatpak=true"
    build-options:
      # rust SDK 扩展提供 cargo/rustc
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        # vendored crates 与 cargo 配置位于源码树 cargo/（见 cargo-sources.json）
        CARGO_HOME: /run/build/fftps/cargo
        CARGO_NET_OFFLINE: "true"
      # cargo 产物无需再剥离；避免 runtime 缺 eu-strip 时构建失败
      strip: false
    sources:
      # 本地/CI 构建直接引用仓库目录；上架 flathub 时改为 type: git
      - type: dir
        path: ../..
      # cargo vendored 源清单（由 flatpak-cargo-generator.py 从 Cargo.lock 生成）
      - cargo-sources.json
