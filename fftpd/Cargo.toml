[package]
name = "fftpd"
description = "fftps 服务端守护进程：组装 FTP + SFTP，经 IPC 提供控制接口"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
fftp-common = { workspace = true }
fftp-ipc = { workspace = true }
fftp-ftp = { workspace = true }
fftp-sftp = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
# 目录属主设置（SetupDirectoryPermissions 等目录辅助命令）
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Windows 服务集成（service_windows：SCM 调度 + 服务控制处理）
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "fftpd"
path = "src/main.rs"

[lints]
workspace = true
