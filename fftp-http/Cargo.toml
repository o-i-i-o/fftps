[package]
name = "fftp-http"
description = "fftps Web 管理前端（axum）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
fftp-common = { workspace = true }
fftp-ipc = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
# launch：脱离终端启动（setsid）与启动锁（flock）
nix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
# Windows 服务集成（service_windows：SCM 调度 + 服务控制处理）
windows-service = "0.8"
# launch：错误提示 MessageBoxW
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "fftp-http"
path = "src/main.rs"

# Windows GUI 子系统启动器（快捷方式目标，避免控制台黑框）
[[bin]]
name = "fftp-http-launcher"
path = "src/launcher.rs"

[lints]
workspace = true
