# fftps CI：静态检查、测试、交叉编译矩阵与打包
# 单平台产出 2 个变体包（都自带 fftpd 后端）：
#   fftp-gui   后端 fftpd + 图形前端
#   fftp-http  后端 fftpd + Web 前端，额外带 fftp-http 自己的服务：
#              Linux 为 systemd --user 单元，Windows 为 install-http.cmd 注册脚本
# 推送 v* 标签时自动构建 deb / tarball / windows zip 并创建 GitHub Release
# 注：cargo fmt 检查暂未纳入——common/ipc/ftp/sftp 在当前 stable rustfmt
# 下存在全量格式漂移（迁移前遗留，另行列清理项）；clippy 同样不加 -D warnings，
# pedantic 告警遗留约百处（集中于 common/ftp 旧迁移代码），
# fftpd / fftp-gui 已全量零告警。
name: CI

on:
  push:
    branches: ["**"]
    tags: [ "v*" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链（含 clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy 检查
        run: cargo clippy --workspace --all-targets

  test:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: cargo test 测试
        run: cargo test --workspace

  build:
    name: 交叉编译（${{ matrix.target }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Rust 目标
        run: rustup target add ${{ matrix.target }}

      - name: 安装 zig（cargo-zigbuild 依赖）
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: 安装 cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 统一入口：linux 全目标与 windows-gnu 均走 cargo-zigbuild
      - name: 构建（scripts/build.sh）
        run: ./scripts/build.sh ${{ matrix.target }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  deb:
    name: deb 打包（ubuntu，fftp-gui + fftp-http）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装系统依赖（图标生成）
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      # 复用 debian/build-deb.sh：release 编译 + 打包 deb（脚本要求 root，CI 有免密 sudo）
      - name: 构建 deb 包
        run: sudo ./debian/build-deb.sh -a amd64 -o dist -n

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: 发布 Release
    # 仅在推送 v* 标签时触发，且 CI 全部通过后才发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 校验标签与 Cargo.toml 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] && [[ "$TAG_VERSION" != "$CARGO_VERSION"-* ]]; then
            echo "标签 ${GITHUB_REF_NAME} 与 Cargo.toml 中的版本 ${CARGO_VERSION} 不一致，请先更新 [workspace.package].version"
            exit 1
          fi

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: 按变体打包 tarball（Linux 各目标）与 Windows zip
        # 每个平台 2 个变体：fftp-gui 与 fftp-http，均含 fftpd 后端；
        # Linux 包附 systemd --user 单元（fftp-http 变体再附自己的服务单元），
        # Windows 包只给二进制与配置模板，附服务注册/卸载脚本：
        # GUI 变体带 install.cmd/uninstall.cmd（注册 fftpd 后端服务），
        # fftp-http 变体带 install-http.cmd/uninstall-http.cmd（注册 fftpd + fftp-http 两个服务）。
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl x86_64-pc-windows-gnu; do
            case "$t" in
              *windows-gnu) EXE=".exe"; WIN=true ;;
              *) EXE=""; WIN=false ;;
            esac
            for flavor in fftp-gui fftp-http; do
              NAME="${flavor}-${TAG_VERSION}-${t}"
              mkdir -p "dist/${NAME}"
              cp "dist/${t}/fftpd${EXE}" "dist/${t}/${flavor}${EXE}" "dist/${NAME}/"
              cp debian/config_example.toml "dist/${NAME}/config.toml"
              if [ "$flavor" = fftp-http ]; then
                cp examples/fftp-http.toml.example "dist/${NAME}/fftp-http.toml"
              fi
              if [ "$WIN" = false ]; then
                cp debian/fftpd.service "dist/${NAME}/"
                chmod 755 "dist/${NAME}/fftpd" "dist/${NAME}/${flavor}"
                if [ "$flavor" = fftp-http ]; then
                  cp debian/fftp-http.service "dist/${NAME}/"
                fi
                tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
              else
                if [ "$flavor" = fftp-gui ]; then
                  cp scripts/windows/install.cmd scripts/windows/uninstall.cmd "dist/${NAME}/"
                else
                  cp scripts/windows/install-http.cmd scripts/windows/uninstall-http.cmd "dist/${NAME}/"
                fi
                (cd dist && zip -qr "${NAME}.zip" "${NAME}")
              fi
              rm -rf "dist/${NAME}"
            done
          done
          ls -lh dist/

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
