# fftps CI：静态检查、测试、交叉编译矩阵与打包
#
# 单一产品形态：fftpd 后端 + fftp-http Web 管理前端
#   - Linux: deb / rpm / tar.gz（amd64 + arm64），附 systemd --user 单元与桌面入口
#   - Windows: 每架构一个 zip（含 install/uninstall 脚本）+ MSI（WiX，原生 msiexec 双架构），
#     注册 fftpd 服务并创建快捷方式
# 推送 v* 标签时自动构建并创建 GitHub Release
# 注：cargo fmt 检查暂未纳入——common/ipc/ftp/sftp 在当前 stable rustfmt
# 下存在全量格式漂移（迁移前遗留，另行列清理项）；clippy 同样不加 -D warnings，
# pedantic 告警遗留约百处（集中于 common/ftp 旧迁移代码）。
name: CI

on:
  push:
    branches: ["**"]
    tags: [ "v*" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链（含 clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy 检查
        run: cargo clippy --workspace --all-targets

  test:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: cargo test 测试
        run: cargo test --workspace

  build:
    name: 交叉编译（${{ matrix.target }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-msvc
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Rust 目标
        run: rustup target add ${{ matrix.target }}

      - name: 安装 zig（cargo-zigbuild 依赖）
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: 安装 cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      # ARM64 Windows（msvc）交叉编译走 cargo-xwin + clang-cl
      - name: 安装 cargo-xwin（arm64 Windows）
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          cargo install cargo-xwin --locked

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 统一入口：linux 全目标与 windows-gnu 走 cargo-zigbuild，arm64 msvc 走 cargo-xwin
      - name: 构建（scripts/build.sh）
        run: ./scripts/build.sh ${{ matrix.target }}

      - name: 构建 Windows zip 交付物
        if: contains(matrix.target, 'windows')
        run: |
          ARCH="x86_64"
          [[ "${{ matrix.target }}" == aarch64* ]] && ARCH="arm64"
          ./scripts/build-zip.sh -a "$ARCH"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  deb:
    name: deb 打包（${{ matrix.arch }}，fftp-http）
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装系统依赖（图标生成）
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # 复用 build 矩阵产物，避免重复交叉编译
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*-linux-*
          merge-multiple: true

      - name: 构建 deb 包
        run: sudo ./scripts/build-deb.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }} -o dist -n

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: rpm 打包（${{ matrix.arch }}，fftp-http）
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*-linux-*
          merge-multiple: true

      - name: 构建 rpm 包
        run: ./scripts/build-rpm.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }} -o dist

      - name: 上传 rpm 产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-rpm-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error

  # MSI 绑定依赖 Windows 原生 msi.dll，必须在 windows runner 上构建
  # （Linux 上 WiX 编译 Directory/@Name 亦会因路径根语义差异误报 WIX0389）
  msi:
    name: MSI（x64 + arm64）
    needs: build
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 dotnet 与 WiX 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*-windows-*
          merge-multiple: true

      - name: 构建 MSI（x64 + arm64）
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext
          ./scripts/build-msi.sh -a x86_64 -b dist/x86_64-pc-windows-gnu
          ./scripts/build-msi.sh -a arm64 -b dist/aarch64-pc-windows-msvc

      - name: 上传 MSI 产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-msi
          path: dist/*.msi
          if-no-files-found: error

  release:
    name: 发布 Release
    # 仅在推送 v* 标签时触发，且 CI 全部通过后才发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build, deb, rpm, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 校验标签与 Cargo.toml 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] && [[ "$TAG_VERSION" != "$CARGO_VERSION"-* ]]; then
            echo "标签 ${GITHUB_REF_NAME} 与 Cargo.toml 中的版本 ${CARGO_VERSION} 不一致，请先更新 [workspace.package].version"
            exit 1
          fi

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: 打包 Linux tarball（附 systemd 用户单元与桌面入口）
        # 单一形态：fftpd + fftp-http，附带两个 systemd --user 单元。
        # Windows 交付物：每架构 zip（含安装/卸载脚本）+ MSI（WiX，windows runner 原生构建）。
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            NAME="fftp-http-${TAG_VERSION}-${t}"
            mkdir -p "dist/${NAME}"
            cp "dist/${t}/fftpd" "dist/${t}/fftp-http" "dist/${NAME}/"
            cp deploy/common/config.toml "dist/${NAME}/config.toml"
            cp deploy/common/fftp-http.toml "dist/${NAME}/fftp-http.toml"
            cp deploy/common/fftpd.service deploy/common/fftp-http.service "dist/${NAME}/"
            cp deploy/common/fftp-http.desktop deploy/common/fftp-http.svg "dist/${NAME}/"
            chmod 755 "dist/${NAME}/fftpd" "dist/${NAME}/fftp-http"
            tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
            rm -rf "dist/${NAME}"
          done
          ls -lh dist/

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true
          fail_on_unmatched_files: true
