# fftps CI：静态检查 → 测试 → 交叉编译 → 打包 → 发布
#
# 流水线按职责拆成两段，互不越界：
#   1. build      只做交叉编译，按目标矩阵产出裸二进制（binaries-<target>）
#   2. package-*  只做打包，下载 binaries-* 后生成 deb / rpm / tar.gz / zip /
#                 msi / flatpak；打包阶段不再触发 cargo/meson 编译（deb 与
#                 flatpak 均走预编译产物模式）
# 推送 v* 标签且全部通过后，release 仅汇总 packages-* 产物并创建 GitHub Release。
#
# 单一产品形态：fftpd 后端 + fftp-http Web 管理前端
#   - Linux: deb / rpm / tar.gz / flatpak（amd64 + arm64），附 systemd --user 单元与桌面入口
#   - Windows: 每架构一个 zip（含 install/uninstall 脚本）+ MSI（WiX，原生 msiexec 双架构），
#     注册 fftpd 服务并创建快捷方式
# 注：cargo fmt 与 cargo clippy 均纳入 CI；clippy 暂不升级为 -D warnings，
# pedantic 告警作为提示保留。
name: CI

on:
  push:
    branches: ["**"]
    tags: [ "v*" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链（含 clippy/rustfmt）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt 检查
        run: cargo fmt --all -- --check

      - name: cargo clippy 检查
        run: cargo clippy --workspace --all-targets

  test:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: cargo test 测试
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # 阶段一：交叉编译（只产出裸二进制，不做任何打包）
  # ---------------------------------------------------------------------------
  build:
    name: 交叉编译（${{ matrix.target }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-msvc
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Rust 目标
        run: rustup target add ${{ matrix.target }}

      - name: 安装 zig（cargo-zigbuild 依赖）
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: 安装 cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      # ARM64 Windows（msvc）交叉编译走 cargo-xwin + clang
      # （ring 强制用普通 clang 编译，clang-cl 后端的 /imsvc CFLAGS 会失败）
      - name: 安装 cargo-xwin（arm64 Windows）
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          cargo install cargo-xwin --locked

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 统一入口：linux 全目标与 windows-gnu 走 cargo-zigbuild，arm64 msvc 走 cargo-xwin
      - name: 交叉编译（scripts/build.sh）
        run: ./scripts/build.sh ${{ matrix.target }}

      # 产物顶层保留 <target>/ 目录，打包阶段按目标目录直接取用
      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 阶段二：打包（只消费 binaries-*，不再编译）
  # ---------------------------------------------------------------------------
  package-deb:
    name: 打包 deb（${{ matrix.arch }}）
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper lintian

      # 预编译模式：debian/rules 按 FFTPS_PREBUILT_DIR 直接安装二进制，
      # 跳过 cargo/meson 编译（交叉架构也无需目标工具链）
      - name: 打包 deb（预编译产物）
        run: ./scripts/build-deb.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }} -o dist -n

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  package-rpm:
    name: 打包 rpm（${{ matrix.arch }}）
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装 rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: 打包 rpm
        run: ./scripts/build-rpm.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }} -o dist

      - name: 上传 rpm 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-rpm-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error

  package-linux-tarball:
    name: 打包 Linux tarball
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 Linux 二进制
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*-linux-*
          merge-multiple: true

      # 单一形态：fftpd + fftp-http，附带两个 systemd --user 单元
      - name: 打包 tarball（附 systemd 用户单元与桌面入口）
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            NAME="fftp-http-${VERSION}-${t}"
            mkdir -p "dist/${NAME}"
            cp "dist/${t}/fftpd" "dist/${t}/fftp-http" "dist/${NAME}/"
            cp deploy/common/config.toml "dist/${NAME}/config.toml"
            cp deploy/common/fftp-http.toml "dist/${NAME}/fftp-http.toml"
            cp deploy/common/fftpd.service deploy/common/fftp-http.service "dist/${NAME}/"
            cp deploy/common/fftp-http.desktop deploy/common/fftp-http.svg "dist/${NAME}/"
            chmod 755 "dist/${NAME}/fftpd" "dist/${NAME}/fftp-http"
            tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
            rm -rf "dist/${NAME}"
          done
          ls -lh dist/

      - name: 上传 tarball 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  package-windows-zip:
    name: 打包 Windows zip（${{ matrix.arch }}）
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-gnu
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 Windows 二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装 zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: 打包 Windows zip
        run: ./scripts/build-zip.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }}

      - name: 上传 zip 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-zip-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  # MSI 绑定依赖 Windows 原生 msi.dll，必须在 windows runner 上构建
  # （Linux 上 WiX 编译 Directory/@Name 亦会因路径根语义差异误报 WIX0389）
  package-msi:
    name: 打包 MSI（x64 + arm64）
    needs: build
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 dotnet 与 WiX 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: 下载 Windows 二进制
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*-windows-*
          merge-multiple: true

      - name: 打包 MSI（x64 + arm64）
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext
          ./scripts/build-msi.sh -a x86_64 -b dist/x86_64-pc-windows-gnu
          ./scripts/build-msi.sh -a arm64 -b dist/aarch64-pc-windows-msvc

      - name: 上传 MSI 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-msi
          path: dist/*.msi
          if-no-files-found: error

  # flatpak 预编译模式：直接封装交叉编译产物，不再在沙箱内 cargo 编译
  package-flatpak:
    name: 打包 flatpak（freedesktop 26.08）
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 Linux 二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: dist

      - name: 安装 flatpak 构建链与 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: 打包 flatpak bundle（预编译产物）
        run: ./scripts/build-flatpak.sh -b dist/x86_64-unknown-linux-gnu

      - name: 上传 flatpak 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 阶段三：发布（只汇总 packages-*，不处理二进制）
  # ---------------------------------------------------------------------------
  release:
    name: 发布 Release
    # 仅在推送 v* 标签时触发，且 CI 全部通过后才发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test
      - build
      - package-deb
      - package-rpm
      - package-linux-tarball
      - package-windows-zip
      - package-msi
      - package-flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 校验标签与 Cargo.toml 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] && [[ "$TAG_VERSION" != "$CARGO_VERSION"-* ]]; then
            echo "标签 ${GITHUB_REF_NAME} 与 Cargo.toml 中的版本 ${CARGO_VERSION} 不一致，请先更新 [workspace.package].version"
            exit 1
          fi

      - name: 下载全部打包产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
          generate_release_notes: true
          fail_on_unmatched_files: true
