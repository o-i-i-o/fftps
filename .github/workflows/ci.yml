# fftps CI：静态检查 → 测试 → 交叉编译 → 打包 → 发布
#
# 产物（严格两架构）：
#   - deb:     fftps_<ver>_amd64.deb / fftps_<ver>_arm64.deb
#   - rpm:     fftps-<ver>-1.x86_64.rpm / fftps-<ver>-1.aarch64.rpm
#   - flatpak: fftps_<ver>_x86_64.flatpak / fftps_<ver>_aarch64.flatpak
#   - windows: fftps-<ver>-windows-x64.zip / fftps-<ver>-windows-arm64.zip（内含 exe）
#
# 流程分两段，职责严格分离：
#   1. build      只做交叉编译（ubuntu-latest 矩阵），上传裸二进制 binaries-<target>
#   2. package-*  只做打包，下载 binaries-* 后生成安装包，不再触发 cargo/meson 编译
#      同架构打包任务运行在对应架构 runner（amd64 → ubuntu-latest，
#      arm64 → ubuntu-24.04-arm），避免交叉打包的依赖解析问题
# 推送 v* 标签且全部通过后，release 仅汇总 packages-* 产物并创建 GitHub Release。
name: CI

on:
  push:
    branches: ["**"]
    tags: [ "v*" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链（含 clippy/rustfmt）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt 检查
        run: cargo fmt --all -- --check

      - name: cargo clippy 检查
        run: cargo clippy --workspace --all-targets

  test:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: cargo test 测试
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # 阶段一：交叉编译（只产出裸二进制，不做任何打包）
  # ---------------------------------------------------------------------------
  build:
    name: 交叉编译（${{ matrix.target }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-msvc
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Rust 目标
        run: rustup target add ${{ matrix.target }}

      - name: 安装 zig（cargo-zigbuild 依赖）
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: 安装 cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      # ARM64 Windows（msvc）交叉编译走 cargo-xwin + clang
      # （ring 强制用普通 clang 编译，clang-cl 后端的 /imsvc CFLAGS 会失败）
      - name: 安装 cargo-xwin（arm64 Windows）
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          cargo install cargo-xwin --locked

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 统一入口：linux 全目标与 windows-gnu 走 cargo-zigbuild，arm64 msvc 走 cargo-xwin
      - name: 交叉编译（scripts/build.sh）
        run: ./scripts/build.sh ${{ matrix.target }}

      # 产物顶层保留 <target>/ 目录，打包阶段按目标目录直接取用
      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 阶段二：打包（只消费 binaries-*，不再编译）
  # ---------------------------------------------------------------------------
  package-deb:
    name: 打包 deb（${{ matrix.arch }}）
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper lintian

      # 预编译模式：debian/rules 按 FFTPS_PREBUILT_DIR 直接安装二进制，
      # 跳过 cargo/meson 编译（交叉架构也无需目标工具链）
      - name: 打包 deb（预编译产物）
        run: ./scripts/build-deb.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }} -o dist -n

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  package-rpm:
    name: 打包 rpm（${{ matrix.arch }}）
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装 rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: 打包 rpm
        run: ./scripts/build-rpm.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }} -o dist

      - name: 上传 rpm 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-rpm-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error

  package-windows-zip:
    name: 打包 Windows zip（${{ matrix.arch }}）
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-gnu
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 Windows 二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装 zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: 打包 Windows zip
        run: ./scripts/build-zip.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }}

      - name: 上传 zip 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-zip-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  # flatpak 预编译模式：直接封装交叉编译产物，不再在沙箱内 cargo 编译。
  # arm64 在原生 arm runner 上打包（flatpak 沙箱命令需与宿主架构一致）。
  package-flatpak:
    name: 打包 flatpak（${{ matrix.arch }}）
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 Linux 二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装 flatpak 构建链与 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: 打包 flatpak bundle（预编译产物）
        run: ./scripts/build-flatpak.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }}

      - name: 上传 flatpak 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 阶段三：发布（只汇总 packages-*，不处理二进制）
  # ---------------------------------------------------------------------------
  release:
    name: 发布 Release
    # 仅在推送 v* 标签时触发，且 CI 全部通过后才发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test
      - build
      - package-deb
      - package-rpm
      - package-windows-zip
      - package-flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 校验标签与 Cargo.toml 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] && [[ "$TAG_VERSION" != "$CARGO_VERSION"-* ]]; then
            echo "标签 ${GITHUB_REF_NAME} 与 Cargo.toml 中的版本 ${CARGO_VERSION} 不一致，请先更新 [workspace.package].version"
            exit 1
          fi

      - name: 下载全部打包产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
            dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
