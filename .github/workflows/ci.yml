# fftps CI：静态检查 → 测试 → 交叉编译 → 打包 → 发布
#
# 产物（严格两架构）：
#   - deb:     fftps_<ver>_amd64.deb / fftps_<ver>_arm64.deb
#   - rpm:     fftps-<ver>-1.x86_64.rpm / fftps-<ver>-1.aarch64.rpm
#   - flatpak: fftps_<ver>_x86_64.flatpak / fftps_<ver>_aarch64.flatpak
#   - windows: fftps-<ver>-windows-{x64,arm64}-setup.exe（Inno 安装向导）
#              fftps-<ver>-windows-{x64,arm64}.zip（便携版，内含 exe 与 install.bat）
#
# 流程分两段，职责严格分离：
#   1. build      只做交叉编译（ubuntu-latest 矩阵），上传裸二进制 binaries-<target>
#   2. package-*  只做打包，下载 binaries-* 后生成安装包，不再触发 cargo/meson 编译
#      同架构打包任务运行在对应架构 runner（amd64 → ubuntu-latest，
#      arm64 → ubuntu-24.04-arm），避免交叉打包的依赖解析问题
# 推送 v* 标签且全部通过后，release 仅汇总 packages-* 产物并创建 GitHub Release。
#
# Windows 交叉编译策略（关键）：
#   - MSVC ABI：x86_64-pc-windows-msvc + aarch64-pc-windows-msvc
#   - Ubuntu 上用 cargo-xwin + clang/clang++（zig 无 MSVC CRT，不可用于 MSVC 目标）
#   - Inno Setup 7 是 64 位安装器，统一用 windows-latest runner
name: CI

on:
  push:
    branches: ["**"]
    tags: [ "v*" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链（含 clippy/rustfmt）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt 检查
        run: cargo fmt --all -- --check

      - name: cargo clippy 检查
        run: cargo clippy --workspace --all-targets

  test:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: cargo test 测试
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # 阶段一：交叉编译（只产出裸二进制，不做任何打包）
  #
  # 分两类 runner：
  #   - ubuntu-latest  → Linux 目标（zig）+ x64 Windows MSVC（cargo-xwin + clang）
  #   - windows-latest → arm64 Windows MSVC（原生 MSVC 工具链，最稳妥）
  #
  # arm64 MSVC 放在 windows-latest 是因为：
  #   cargo-xwin 在 ubuntu 上需要额外的 arm64 MSVC CRT 下载，而 windows-latest
  # 自带完整的 MSVC Build Tools（含 arm64 交叉编译组件），原生编译零额外依赖。
  # ---------------------------------------------------------------------------

  build-linux:
    name: 交叉编译 Linux（${{ matrix.target }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Rust 目标
        run: rustup target add ${{ matrix.target }}

      - name: 安装 zig（cargo-zigbuild 依赖）
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: 安装 cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 交叉编译（zigbuild）
        run: ./scripts/build.sh ${{ matrix.target }}

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # x64 Windows MSVC：ubuntu-latest + cargo-xwin + clang
  build-win-x64:
    name: 交叉编译 Windows x64 (MSVC)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Rust 目标
        run: rustup target add x86_64-pc-windows-msvc

      - name: 安装 cargo-xwin + clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          cargo install cargo-xwin --locked

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: 交叉编译（cargo-xwin + clang）
        run: ./scripts/build.sh x86_64-pc-windows-msvc

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: binaries-x86_64-pc-windows-msvc
          path: dist/
          if-no-files-found: error

  # arm64 Windows MSVC：windows-latest 原生编译（自带完整 MSVC arm64 CRT）
  build-win-arm64:
    name: 编译 Windows arm64 (MSVC)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Rust 目标
        run: rustup target add aarch64-pc-windows-msvc

      - name: 确认 MSVC arm64 工具链可用
        shell: pwsh
        run: |
          $arm64lib = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\lib\arm64" `
            -Directory -EA SilentlyContinue | Select-Object -First 1
          if ($arm64lib) {
            Write-Host "arm64 MSVC CRT 可用: $($arm64lib.FullName)"
          } else {
            Write-Host "arm64 MSVC CRT 未安装，尝试安装..."
            # 在 windows-latest 上 arm64 组件通常已经存在；如果不在，手动装
            & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" `
              modify --installPath "${env:ProgramFiles}\Microsoft Visual Studio\2022\BuildTools" `
              --add "Microsoft.VisualStudio.Component.VC.Tools.ARM64" --passive --norestart 2>&1 | Out-Host
          }
          rustc -vV | Select-String "host"

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-pc-windows-msvc

      - name: 原生编译 arm64 MSVC
        run: cargo build --release --target aarch64-pc-windows-msvc -p fftpd -p fftp-http

      - name: 收集产物
        shell: pwsh
        run: |
          $out = "dist\aarch64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "target\aarch64-pc-windows-msvc\release\fftpd.exe" $out
          Copy-Item "target\aarch64-pc-windows-msvc\release\fftp-http.exe" $out
          Copy-Item "target\aarch64-pc-windows-msvc\release\fftp-http-launcher.exe" $out
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: binaries-aarch64-pc-windows-msvc
          path: dist/aarch64-pc-windows-msvc/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 阶段二：打包（只消费 binaries-*，不再编译）
  # ---------------------------------------------------------------------------
  package-deb:
    name: 打包 deb（${{ matrix.arch }}）
    needs: build-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper lintian

      - name: 打包 deb（预编译产物）
        run: ./scripts/build-deb.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }} -o dist -n

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  package-rpm:
    name: 打包 rpm（${{ matrix.arch }}）
    needs: build-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装 rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: 打包 rpm
        run: ./scripts/build-rpm.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }} -o dist

      - name: 上传 rpm 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-rpm-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error

  package-windows-zip:
    name: 打包 Windows zip（${{ matrix.arch }}）
    needs: [build-win-x64, build-win-arm64]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 Windows 二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装 zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: 打包 Windows zip
        run: ./scripts/build-zip.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }}

      - name: 上传 zip 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-zip-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  # Inno Setup 安装向导（每个架构一个 setup.exe）。
  # Inno 编译器 ISCC 只能在 Windows 上运行，故打包放在 windows-latest，
  # 只消费 build 阶段上传的裸二进制，不触发 cargo 编译。
  # Inno Setup 7 是 64 位安装器（与 6.x 32 位不同），安装路径统一在
  # C:\Program Files\Inno Setup 7\ISCC.exe
  package-windows-inno:
    name: 打包 Windows 安装向导（${{ matrix.arch }}）
    needs: [build-win-x64, build-win-arm64]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 Windows 二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装 Inno Setup 7.1.1
        shell: pwsh
        run: |
          Write-Host "=== 尝试三种方式安装 Inno Setup 7.1.1 ==="
          $installerUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'

          # 方式 1: winget（windows-latest 自带）
          $iscc = $null
          try {
            Write-Host "[1/3] 尝试 winget..."
            winget install --id JRSoftware.InnoSetup.7 -e --source winget `
              --accept-package-agreements --accept-source-agreements --silent 2>&1 | Out-Host
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
          } catch { Write-Host "winget 失败: $_" }

          # 方式 2: chocolatey（windows-latest 也自带）
          if (-not $iscc) {
            try {
              Write-Host "[2/3] 尝试 chocolatey..."
              choco install innosetup --version=7.1.1 -y 2>&1 | Out-Host
              $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
            } catch { Write-Host "choco 失败: $_" }
          }

          # 方式 3: 手动下载 + 静默安装
          if (-not $iscc) {
            Write-Host "[3/3] 手动下载 Inno Setup 7.1.1..."
            $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri $installerUrl -OutFile $installer -TimeoutSec 120
            Write-Host "下载完成，开始安装..."
            & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Host
          }

          # 极简探测：三个硬编码候选路径按优先级查
          Write-Host "=== 查找 ISCC.exe ==="
          $candidates = @(
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            (Join-Path ${env:LOCALAPPDATA} 'Programs\Inno\ISCC.exe')
          )
          foreach ($c in $candidates) {
            Write-Host "  检查: $c"
            if (Test-Path $c) {
              $iscc = $c
              Write-Host "  ✓ 找到!"
              break
            }
          }

          if (-not $iscc) {
            # 最后手段：全盘搜（只搜前两层，避免太慢）
            Write-Host "硬编码路径都没找到，全盘搜..."
            foreach ($root in @('C:\Program Files', 'C:\Program Files (x86)', $env:LOCALAPPDATA)) {
              $found = Get-ChildItem $root -Filter ISCC.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $iscc = $found.FullName; break }
            }
          }

          if (-not $iscc) { throw 'Inno Setup 安装失败：未找到 ISCC.exe' }
          Write-Host "ISCC.exe = $iscc"
          Write-Host "ISCC 版本:"
          & $iscc 2>&1 | Select-Object -First 1 | Out-Host
          Split-Path $iscc -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 打包 Inno 安装包
        shell: bash
        run: bash ./scripts/build-inno.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }}

      - name: 上传 Inno 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-inno-${{ matrix.arch }}
          path: dist/*-setup.exe
          if-no-files-found: error

  # flatpak 预编译模式：直接封装交叉编译产物，不再在沙箱内 cargo 编译。
  # arm64 在原生 arm runner 上打包（flatpak 沙箱命令需与宿主架构一致）。
  package-flatpak:
    name: 打包 flatpak（${{ matrix.arch }}）
    needs: build-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 Linux 二进制
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: 安装 flatpak 构建链与 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: 打包 flatpak bundle（预编译产物）
        run: ./scripts/build-flatpak.sh -a ${{ matrix.arch }} -b dist/${{ matrix.target }}

      - name: 上传 flatpak 产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 阶段三：发布（只汇总 packages-*，不处理二进制）
  # ---------------------------------------------------------------------------
  release:
    name: 发布 Release
    # 仅在推送 v* 标签时触发，且 CI 全部通过后才发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test
      - build-linux
      - build-win-x64
      - build-win-arm64
      - package-deb
      - package-rpm
      - package-windows-zip
      - package-windows-inno
      - package-flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 校验标签与 Cargo.toml 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] && [[ "$TAG_VERSION" != "$CARGO_VERSION"-* ]]; then
            echo "标签 ${GITHUB_REF_NAME} 与 Cargo.toml 中的版本 ${CARGO_VERSION} 不一致，请先更新 [workspace.package].version"
            exit 1
          fi

      - name: 下载全部打包产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
            dist/*.zip
            dist/*-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
