[package]
name = "fftp-gui"
description = "fftps 前端管理程序（Slint 跨平台 GUI）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
fftp-common = { workspace = true }
fftp-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
# 新用户口令哈希：UserManager::hash_password 未暴露公开接口，
# GUI 侧按同参数（Argon2id m=65536,t=3,p=4,len=32）生成 PHC 字符串
argon2 = { workspace = true }
chrono = { workspace = true }
# 默认 winit + femtovg 后端（零系统 GUI 依赖）；目标国产系统
# （UOS/Deepin/麒麟，Qt5 桌面）可加 `--features qt` 启用 Qt 后端，
# 并以 SLINT_BACKEND=qt 选择运行时后端
slint = { workspace = true }
arboard = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[features]
default = []
qt = ["slint/backend-qt"]

[[bin]]
name = "fftp-gui"
path = "src/main.rs"

[lints]
workspace = true
