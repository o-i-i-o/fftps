[package]
name = "fftp-gui"
description = "fftps 前端管理程序（iced 跨平台 GUI）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
fftp-common = { workspace = true }
fftp-ipc = { workspace = true }
# 必须启用 tokio 执行器：fftp-ipc 内部使用 tokio::spawn，
# 且日志订阅要桥接 tokio broadcast 通道、重连退避用 tokio 定时器
iced = { version = "0.14.0", features = ["tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
# 新用户口令哈希：UserManager::hash_password 未暴露公开接口，
# GUI 侧按同参数（Argon2id m=65536,t=3,p=4,len=32）生成 PHC 字符串
argon2 = { workspace = true }
chrono = { workspace = true }

[[bin]]
name = "fftp-gui"
path = "src/main.rs"

[lints]
workspace = true
